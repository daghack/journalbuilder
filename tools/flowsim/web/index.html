<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow paths</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 8 C7 3 10 13 14 8 S20 6 22 8 M2 15 C7 10 10 20 14 15 S20 13 22 15' fill='none' stroke='%23c0392b' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/page.css" />
  </head>
  <body>
    <header id="bar"><span class="brand">Flow paths</span></header>
    <main>
      <nav id="tools"></nav>
      <section id="stage"></section>
      <aside id="panel"></aside>
    </main>
    <footer id="status">Loading the engine…</footer>
    <dialog id="export-dialog" class="flowsim">
      <form method="dialog" class="export">
        <h2>Export SVG</h2>
        <div class="export-body">
          <div class="export-options" id="export-options"></div>
          <div class="export-preview">
            <img id="export-preview" alt="The SVG to export" />
            <p class="info" id="export-info"></p>
          </div>
        </div>
        <div class="actions">
          <button value="close">Close</button>
          <button id="export-download" class="primary" value="download">Download</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
