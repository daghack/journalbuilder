[package]
name = "journalbuilder"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "webapp/wasm"]

[features]
# Compile the layout and lock files and config/fonts.json into the library
# (`rhaientries::embedded`), for builds with no files to read, like the
# web editor's.
embedded-assets = []

[dependencies]
# Darkly from the fork's stroke-bounded-passes branch (off its
# offline-render-perf, off its dev, which follows darkly-art/darkly's): each
# stroke's undo and commit cover only its dabs, and the brush graph compiles
# once per change, for renders about 3x faster than dev.
# Pinned to a commit, so a `cargo update` can't change how journals render.
darkly = { git = "https://github.com/daghack/darkly.git", rev = "f80948d28b43e0323fdeb3fb73e05d9c77b3912d" }
flate2 = "1.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "rayon"] }
noise = "0.9.0"
parry2d = "0.26.1"
petgraph = "0.7.1"
rand = { version = "0.9.0", default-features = false, features = ["std", "std_rng"] }
rayon = "1.11.0"
resvg = { version = "0.45.1", default-features = false }
rhai = { version = "1.25.1", features = ["metadata"] }
serde = { version = "1.0.140", features = ["derive"] }
serde_json = "1.0.140"
stretch = "0.3.2"
svgtypes = "0.15.3"
tiny-skia = "0.11.4"
usvg = { version = "0.45.1", default-features = false }
wgpu = "29.0.4"
# std::time::Instant, which panics in the browser, made to work there too.
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
smol = "2.0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rhai's hashing seeds itself from getrandom, which in the browser needs
# its JS backend.
rhai = { version = "1.25.1", features = ["metadata", "wasm-bindgen"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[lib]
name = "scribe"
path = "src/lib.rs"

[[bin]]
name = "journalbuild"

# Optimize dependencies even in dev builds: rendering (resvg, tiny-skia, rhai,
# darkly) is unusably slow unoptimized, while our own crate still
# rebuilds quickly.
[profile.dev.package."*"]
opt-level = 3
