[package]
name = "journalbuilder"
version = "0.1.0"
edition = "2024"

[dependencies]
# Fork with DarklyEngine::stroke_path (batched offline strokes); switch back
# to darkly-art/darkly once it lands upstream.
darkly = { git = "https://github.com/daghack/darkly.git", branch = "offline-stroke-path" }
image = "0.25.10"
kdtree = "0.7.0"
noise = "0.9.0"
parry2d = "0.26.1"
petgraph = "0.7.1"
rand = "0.9.0"
rayon = "1.11.0"
resvg = "0.45.1"
rhai = { version = "1.25.1", features = ["serde"] }
serde = { version = "1.0.140", features = ["derive"] }
serde_json = "1.0.140"
smol = "2.0.2"
svgtypes = "0.15.3"
tiny-skia = "0.11.4"
usvg = "0.45.1"
wgpu = "29.0.4"

[lib]
name = "scribe"
path = "src/lib.rs"

[[bin]]
name = "journalbuild"

# Optimize dependencies even in dev builds: rendering (resvg, tiny-skia, rhai,
# kdtree, darkly) is unusably slow unoptimized, while our own crate still
# rebuilds quickly.
[profile.dev.package."*"]
opt-level = 3
