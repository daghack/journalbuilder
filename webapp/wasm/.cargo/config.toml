# What the web editor runs, built for speed: whole-program optimization, and
# wasm's SIMD, which every browser with WebGPU has. Together about 10% off a
# render and 1.5MB off the module. wasm-pack builds from this directory.
[profile.release]
lto = "fat"
codegen-units = 1

[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
