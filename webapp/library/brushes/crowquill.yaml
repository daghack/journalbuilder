name: Crowquill
description: A fine steel mapping pen that holds a hairline under a light hand and swells only when pressed hard, for coastlines, rivers, contours and the small lettering of maps.
nodes:
  brush_settings:
    type: brush_settings
    inputs:
      stabilize: 0.5
  circle:
    type: circle
    name: Pointed nib
    inputs:
      softness: 0.12
  curve:
    type: curve
    name: Hairline, then swell
    comment: the tines stay together until the pen is pressed hard, then spread
    inputs:
      curve: [[0.0, 0.16], [0.55, 0.26], [0.8, 0.55], [1.0, 1.0]]
  curve_2:
    type: curve
    name: Quick ink
    inputs:
      curve: [[0.0, 0.0], [0.25, 0.8], [1.0, 1.0]]
  paint:
    type: paint
  paint_color:
    type: paint_color
  pen_input:
    type: pen_input
  stamp:
    type: stamp
connections:
- circle.mask -> stamp.tip
- curve.output -> paint.size
- curve_2.output -> paint.build_flow
- paint_color.color -> stamp.color
- pen_input.position -> paint.position
- pen_input.pressure -> curve.input
- pen_input.pressure -> curve_2.input
- stamp.dab -> paint.rgba
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  circle.softness: {}
  paint.opacity: {}
