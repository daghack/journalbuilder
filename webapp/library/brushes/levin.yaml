name: Levin
description: Lightning, the stroke crackling along its way in short crooked strikes that throw a longer fork now and then, with a pale glare about it.
nodes:
  brush_settings:
    type: brush_settings
    inputs:
      spacing: 0.06
      stabilize: 0.5
  bolt:
    type: circle
    name: Strike
    comment: a needle laid along the stroke, then thrown off it by the crook
    inputs:
      aspect: 0.06
      rotation: 1.5708
      softness: 0.08
  crook:
    type: random
    name: Crook
  crook_angle:
    type: remap
    name: Up to a radian either way
    inputs:
      clamp: true
      out_high: 1.05
      out_low: -1.05
  thrown:
    type: add
  reach:
    type: random
    name: Each strike's reach
  reach_curve:
    type: curve
    name: Short, with a long fork now and then
    inputs:
      curve: [[0.0, 0.16], [0.85, 0.3], [0.96, 0.62], [1.0, 1.0]]
  sized:
    type: multiply
  glare:
    type: circle
    name: Glare
    inputs:
      softness: 1.0
  glare_strength:
    type: multiply
    inputs:
      b: 0.1
  sum:
    type: add
  full:
    type: remap
    name: At most full
    inputs:
      clamp: true
  paint:
    type: paint
    inputs:
      buildup: 0.0
  paint_color:
    type: paint_color
  pen_input:
    type: pen_input
  stamp:
    type: stamp
connections:
- bolt.mask -> sum.a
- crook.value -> crook_angle.input
- crook_angle.output -> thrown.b
- full.output -> stamp.tip
- glare.mask -> glare_strength.a
- glare_strength.result -> sum.b
- paint_color.color -> stamp.color
- pen_input.drawing_angle -> thrown.a
- pen_input.position -> paint.position
- pen_input.pressure -> sized.a
- reach.value -> reach_curve.input
- reach_curve.output -> sized.b
- sized.result -> paint.size
- stamp.dab -> paint.rgba
- sum.result -> full.input
- thrown.result -> bolt.rotation_input
exposed_ports:
  brush_settings.size: {}
  crook_angle.out_high: {}
  glare_strength.b: {}
  paint.opacity: {}
