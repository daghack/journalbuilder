name: Sepia Wash
description: A thin wash of sepia, its edge broken and every dab's different, that pools dark at its rim as it dries, for shading a coast, a mountain's flank or the stain of age.
nodes:
  brush_settings:
    type: brush_settings
    inputs:
      stabilize: 0.5
  circle:
    type: circle
    inputs:
      algorithm: 1
      amplitude: 0.3
      frequency: 9.0
      octaves: 4.0
      persistence: 0.5
      softness: 0.1
  thin:
    type: remap
    name: A thin wash
    inputs:
      clamp: true
      out_high: 0.55
      out_low: 0.05
  random:
    type: random
  paint_color:
    type: paint_color
  pen_input:
    type: pen_input
  watercolor:
    type: watercolor
connections:
- circle.mask -> watercolor.mask
- paint_color.color -> watercolor.color
- pen_input.position -> watercolor.position
- pen_input.pressure -> thin.input
- random.value -> circle.seed
- thin.output -> watercolor.flow
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
  watercolor.deposit: {}
  watercolor.opacity: {}
  watercolor.wetness: {}
