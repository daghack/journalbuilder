name: Glossolalia
description: A script no hand wrote. Every dab is a letter of it, a bowl of some number of lobes opened on one side and a stave struck through at one of four angles, and no letter comes twice; draw a line and it writes a line of them.
nodes:
  brush_settings:
    type: brush_settings
    inputs:
      spacing: 1.0
      stabilize: 0.5
  round:
    type: circle
    name: Round the letter
    comment: soft to its rim, so it measures how far out a point is
    inputs:
      softness: 1.0
  lobes:
    type: random
    name: How many lobes
  lobe_count:
    type: remap
    name: One to five
    comment: the wire to Frequency maps 0..1 onto its 1..16
    inputs:
      clamp: true
      out_high: 0.27
      out_low: 0.0
  fatness:
    type: random
    name: How fat
  fat_range:
    type: remap
    comment: the wire to n1 maps 0..1 onto its 0.1..16
    inputs:
      clamp: true
      out_high: 0.3
      out_low: 0.04
  squash:
    type: random
    name: How squashed
  squash_range:
    type: remap
    inputs:
      clamp: true
      out_high: 1.0
      out_low: 0.5
  turn:
    type: random
    name: Which way up
  turn_angle:
    type: multiply
    inputs:
      b: 6.2832
  bowl:
    type: circle
    name: Bowl
    inputs:
      algorithm: 2
      n2: 1.5
      n3: 1.5
      softness: 0.2
  bowl_inverse:
    type: invert
  bowl_edge:
    type: multiply
    name: Only its outline
  bowl_line:
    type: multiply
    inputs:
      b: 4.0
  opening:
    type: random
    name: Where it opens
  opening_angle:
    type: multiply
    inputs:
      b: 6.2832
  kept:
    type: circle
    name: The side that's kept
    comment: a fat lobe to one side; the bowl's outline shows only inside it
    inputs:
      algorithm: 2
      frequency: 1.0
      n1: 0.8
      n2: 1.0
      n3: 1.0
      softness: 0.08
  opened:
    type: multiply
  slant:
    type: random
    name: The stave's slant
  slant_steps:
    type: curve
    name: One of four
    comment: upright, a slant either way, or flat
    inputs:
      curve: [[0.0, 0.0], [0.23, 0.0], [0.27, 0.25], [0.48, 0.25], [0.52, 0.5], [0.73, 0.5], [0.77, 0.75], [1.0, 0.75]]
  slant_angle:
    type: multiply
    inputs:
      b: 3.1416
  stave:
    type: circle
    name: Stave
    inputs:
      aspect: 0.07
      softness: 0.08
  reach:
    type: random
    name: The stave's reach
  reach_at:
    type: remap
    inputs:
      clamp: true
      out_high: 0.6
      out_low: 0.05
  reach_edge:
    type: add
    inputs:
      b: 0.03
  within:
    type: remap
    inputs:
      clamp: true
  struck:
    type: multiply
  sum:
    type: add
  full:
    type: remap
    name: Between nothing and full
    inputs:
      clamp: true
  letter_size:
    type: multiply
    name: Room between letters
    inputs:
      b: 0.74
  paint:
    type: paint
    inputs:
      buildup: 0.0
  paint_color:
    type: paint_color
  pen_input:
    type: pen_input
  stamp:
    type: stamp
connections:
- bowl.mask -> bowl_edge.a
- bowl.mask -> bowl_inverse.input
- bowl_edge.result -> bowl_line.a
- bowl_inverse.output -> bowl_edge.b
- bowl_line.result -> opened.a
- fat_range.output -> bowl.n1
- fatness.value -> fat_range.input
- full.output -> stamp.tip
- kept.mask -> opened.b
- letter_size.result -> paint.size
- lobe_count.output -> bowl.frequency
- lobes.value -> lobe_count.input
- opened.result -> sum.a
- opening.value -> opening_angle.a
- opening_angle.result -> kept.rotation_input
- paint_color.color -> stamp.color
- pen_input.position -> paint.position
- pen_input.pressure -> letter_size.a
- reach.value -> reach_at.input
- reach_at.output -> reach_edge.a
- reach_at.output -> within.in_low
- reach_edge.result -> within.in_high
- round.mask -> within.input
- slant.value -> slant_steps.input
- slant_angle.result -> stave.rotation_input
- slant_steps.output -> slant_angle.a
- squash_range.output -> bowl.aspect
- squash.value -> squash_range.input
- stamp.dab -> paint.rgba
- stave.mask -> struck.a
- struck.result -> sum.b
- sum.result -> full.input
- turn.value -> turn_angle.a
- turn_angle.result -> bowl.rotation_input
- within.output -> struck.b
exposed_ports:
  brush_settings.size: {}
  brush_settings.spacing: {}
  letter_size.b: {}
  paint.opacity: {}
