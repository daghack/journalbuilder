# The journal editor's static site (see webapp/Dockerfile).
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # Every file has a gzipped copy beside it, made at build time.
    gzip_static on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Bundles named by their content's hash never change.
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The renderer and the examples keep their names from build to build:
    # check they're current.
    location /wasm/ {
        default_type application/wasm;
        add_header Cache-Control "no-cache";
    }

    location /examples/ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }
}
